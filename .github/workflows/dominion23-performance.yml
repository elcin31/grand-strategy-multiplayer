name: Dominion 2.3 native performance gate
on:
  push:
    branches: [dominion-2.3-performance]
    paths: [.github/workflows/dominion23-performance.yml]
  workflow_dispatch:
    inputs:
      baseline_apk_run_id:
        description: Accepted camera-only baseline build; empty uses the published 2.2.1 hotfix
        type: string
        default: '38575813534'
      build_candidate:
        description: Build current runtime and compare with the exact published 2.2.1 APK
        type: boolean
        default: false
      baseline_control:
        description: Measure emulator variation with the identical published APK twice; no candidate acceptance
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  build-candidate:
    if: inputs.build_candidate == true && inputs.baseline_control != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run typecheck && npm run test:23-performance
      - name: Full source and content regression on the build runtime
        run: npm run validate:content && npm test > source-regression.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: dominion23-source-validation, path: source-regression.txt, retention-days: 30}
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - run: npx expo prebuild --platform android --clean
      - run: python scripts/verify-native-config.py && python scripts/verify-hotfix-assets.py --native
      - run: cd android && chmod +x gradlew && NODE_ENV=production ./gradlew assembleRelease --no-daemon
      - name: Verify the built standalone binary, all retained graphics and signature
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Dominion-2.3-performance-candidate.apk
          python scripts/verify-apk.py Dominion-2.3-performance-candidate.apk
          python scripts/verify-release.py Dominion-2.3-performance-candidate.apk > integrity.txt
          python scripts/verify-map22.py Dominion-2.3-performance-candidate.apk
          python scripts/verify-hotfix-assets.py Dominion-2.3-performance-candidate.apk
          python scripts/verify-immutable-borders-apk.py Dominion-2.3-performance-candidate.apk >> integrity.txt
          python scripts/verify-ui-dispatch-apk.py Dominion-2.3-performance-candidate.apk >> integrity.txt
          sha256sum Dominion-2.3-performance-candidate.apk >> integrity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dominion23-performance-candidate
          path: |
            Dominion-2.3-performance-candidate.apk
            integrity.txt
            android/launcher-icon-proof.json
            android/map-texture-opacity.json
            android/skia-recorder-lifecycle.json
            android/skia-immutable-borders.json
            android/skia-ui-dispatch.json
          retention-days: 30
  long-simulation:
    if: inputs.build_candidate == true && inputs.baseline_control != true
    name: long-${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix: {mode: [monthly, daily]}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Ten thousand deterministic steps and exact save restores
        env: {MODE: '${{ matrix.mode }}'}
        run: |
          mkdir -p "$RUNNER_TEMP/dominion-long-$MODE"
          cd "$RUNNER_TEMP/dominion-long-$MODE"
          args=()
          if [ "$MODE" = daily ]; then args+=(--daily); fi
          node --expose-gc --import "$GITHUB_WORKSPACE/node_modules/tsx/dist/loader.mjs" "$GITHUB_WORKSPACE/scripts/long-simulation.ts" "${args[@]}" > run.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion23-long-${{ matrix.mode }}
          path: ${{ runner.temp }}/dominion-long-${{ matrix.mode }}/
          retention-days: 30
  profile:
    needs: build-candidate
    if: always() && (needs.build-candidate.result == 'success' || needs.build-candidate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Reject conflicting comparison modes
        env: {BUILD_CANDIDATE: '${{ inputs.build_candidate }}', BASELINE_CONTROL: '${{ inputs.baseline_control }}'}
        run: test "$BUILD_CANDIDATE" != true || test "$BASELINE_CONTROL" != true
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: npm ci --include=dev --no-audit --no-fund
      - run: python -m pip install -r scripts/camera-profile-requirements.txt -r scripts/camera-trace-requirements.txt
      - name: Download and verify the immutable last tested optimized baseline
        env: {GH_TOKEN: '${{ github.token }}', BASELINE_RUN: '${{ inputs.baseline_apk_run_id }}'}
        run: bash scripts/prepare-camera23-baseline.sh "$BASELINE_RUN" camera23-fixture
      - uses: actions/download-artifact@v4
        if: inputs.build_candidate == true
        with: {name: dominion23-performance-candidate, path: candidate-apk}
      - name: Compile reproducible real-pointer input
        run: |
          mkdir -p camera23-classes camera23-dex
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d camera23-classes scripts/CameraGesture23.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output camera23-dex camera23-classes/CameraGesture23.class
          cd camera23-dex && zip ../dominion-camera23.jar classes.dex
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env: {COMPARE_CANDIDATE: '${{ inputs.build_candidate }}', BASELINE_CONTROL: '${{ inputs.baseline_control }}'}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -noaudio -no-boot-anim -camera-back none
          script: |
            adb push dominion-camera23.jar /data/local/tmp/dominion-camera23.jar
            CAMERA23_OUT=profile-baseline python scripts/android23-profile.py baseline-apk/Dominion-2.2.1-performance-hotfix.apk camera23-fixture
            if [ "$COMPARE_CANDIDATE" = 'true' ]; then CAMERA23_OUT=profile-candidate python scripts/android23-profile.py candidate-apk/Dominion-2.3-performance-candidate.apk camera23-fixture; fi
            if [ "$BASELINE_CONTROL" = 'true' ]; then CAMERA23_OUT=profile-candidate python scripts/android23-profile.py baseline-apk/Dominion-2.2.1-performance-hotfix.apk camera23-fixture; fi
      - name: Analyze observed scheduler and CPU samples; retain incomplete attribution
        if: always()
        run: |
          for trace in profile-*/diagnostic-*; do
            if [ -f "$trace/trace-capture.json" ]; then
              python scripts/analyze-camera-trace.py "$trace"
              python scripts/analyze-camera-cpu.py "$trace"
              python scripts/analyze-ui-dispatch.py "$trace"
            fi
          done
      - name: Require the completed matrix metric gate
        if: success() && (inputs.build_candidate == true || inputs.baseline_control == true)
        run: python scripts/compare-camera23.py profile-baseline profile-candidate --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion23-native-performance
          path: |
            profile-baseline/
            profile-candidate/
            camera23-fixture/manifest.json
            camera23-comparison.json
          retention-days: 30

name: Dominion Expansion native checkpoint
on:
  push:
    branches: [expansion-qa]
    paths:
      - .github/workflows/expansion-native-checkpoint.yml
      - .github/expansion-apk-source
      - scripts/android-smoke.py
      - scripts/native_campaign_feedback.py
      - tests/native_campaign_feedback_test.py
      - tests/fixtures/native_campaign_loading.xml
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Successful Expansion checkpoint build run
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful gates and identical APK runtime sources
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        run: |
          if [ -z "$APK_RUN_ID" ]; then APK_RUN_ID=$(cat .github/expansion-apk-source); fi
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]]
          artifact_sha=$(gh api "repos/elcin31/grand-strategy-multiplayer/actions/runs/$APK_RUN_ID" --jq .head_sha)
          gh api "repos/elcin31/grand-strategy-multiplayer/actions/runs/$APK_RUN_ID/jobs" > source-jobs.json
          python -c "import json; j=json.load(open('source-jobs.json')); assert all(any(v['name']==n and v['conclusion']=='success' for v in j['jobs']) for n in ['build-apk','long-simulation']), 'APK build or 10000-tick gate is not successful'"
          git diff --exit-code "$artifact_sha" HEAD -- App.tsx CampaignScreen.tsx app.json package.json package-lock.json src supabase/functions plugins assets
          echo "run_id=$APK_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "$artifact_sha" > apk-runtime-source.txt
      - uses: actions/download-artifact@v4
        with:
          name: dominion-camera-illustrated-release
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - run: python -m unittest discover -s tests -p 'native_campaign_feedback_test.py'
      - name: Verify the byte-identical standalone APK
        run: |
          python scripts/verify-apk.py Dominion-camera-optimized-illustrated.apk
          python scripts/verify-release.py Dominion-camera-optimized-illustrated.apk > checkpoint-integrity.txt
          sha256sum Dominion-camera-optimized-illustrated.apk >> checkpoint-integrity.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: DOMINION_STRESS_SECONDS=1800 python scripts/android-smoke.py Dominion-camera-optimized-illustrated.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-native-checkpoint-evidence
          path: |
            android-smoke/
            source-jobs.json
            apk-runtime-source.txt
            checkpoint-integrity.txt
          retention-days: 14

name: Dominion in-place release upgrade QA
on:
  push:
    branches: [expansion-qa]
    paths:
      - .github/workflows/android-upgrade-qa.yml
      - .github/android-upgrade-source
      - scripts/android-upgrade-qa.py
      - scripts/native_upgrade_validation.py
      - tests/native_upgrade_validation_test.py
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Successful compatible checkpoint build
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  release-upgrade-save:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact candidate runtime and successful original APK builds
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        run: |
          if [ -z "$APK_RUN_ID" ]; then APK_RUN_ID=$(cat .github/android-upgrade-source); fi
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/elcin31/grand-strategy-multiplayer/actions/runs/$APK_RUN_ID" > candidate-run.json
          gh api "repos/elcin31/grand-strategy-multiplayer/actions/runs/$APK_RUN_ID/jobs" > candidate-jobs.json
          candidate_sha=$(python -c "import json;print(json.load(open('candidate-run.json'))['head_sha'])")
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$candidate_sha" HEAD -- App.tsx CampaignScreen.tsx app.json package.json package-lock.json src supabase/functions plugins assets
          python -c "import json;j=json.load(open('candidate-jobs.json'))['jobs'];assert all(any(x['name']==n and x['status']=='completed' and x['conclusion']=='success' for x in j) for n in ['build-apk','long-simulation'])"
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/37971350100 > baseline-run.json
          python -c "import json;r=json.load(open('baseline-run.json'));assert r['head_sha']=='47b0db4f8b220e9ea89998afaac035239b64f5e0' and r['conclusion']=='success'"
          echo "run_id=$APK_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - run: python -m unittest discover -s tests -p 'native_upgrade_validation_test.py'
      - name: Generate the original accepted immutable schema12 campaign
        run: |
          git diff --exit-code 47b0db4f8b220e9ea89998afaac035239b64f5e0 HEAD -- supabase/functions/_shared/worldDefinitions.ts supabase/functions/_shared/worldData
          fixture_source="$RUNNER_TEMP/dominion-upgrade-fixture"
          git worktree add --detach "$fixture_source" 47b0db4f8b220e9ea89998afaac035239b64f5e0
          cp scripts/make-camera-fixture.ts "$fixture_source/scripts/make-camera-fixture.ts"
          node --import tsx "$fixture_source/scripts/make-camera-fixture.ts" "$GITHUB_WORKSPACE/camera-fixture"
      - uses: actions/download-artifact@v4
        with:
          name: dominion-camera-illustrated-release
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate-apk
      - uses: actions/download-artifact@v4
        with:
          name: dominion-camera-illustrated-release
          run-id: 37971350100
          github-token: ${{ github.token }}
          path: baseline-apk
      - name: Verify standalone candidate binary
        run: |
          python scripts/verify-apk.py candidate-apk/Dominion-camera-optimized-illustrated.apk
          python scripts/verify-release.py candidate-apk/Dominion-camera-optimized-illustrated.apk > candidate-integrity.txt
          python scripts/verify-packaged-art.py candidate-apk/Dominion-camera-optimized-illustrated.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python scripts/android-upgrade-qa.py baseline-apk/Dominion-camera-optimized-illustrated.apk candidate-apk/Dominion-camera-optimized-illustrated.apk camera-fixture/camera-fixture-101.1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-upgrade-save-evidence
          path: |
            android-upgrade/
            candidate-run.json
            candidate-jobs.json
            baseline-run.json
            candidate-integrity.txt
            camera-fixture/manifest.json
          retention-days: 14

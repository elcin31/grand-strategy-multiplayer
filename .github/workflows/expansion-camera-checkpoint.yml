name: Dominion fixed-world native camera checkpoint
on:
  push:
    branches: [expansion-camera-qa]
    paths: [.github/workflows/expansion-camera-checkpoint.yml, scripts/android-camera-profile.py, scripts/android_accessibility.py, scripts/compare-camera-native.py, scripts/export-camera-evidence.py, scripts/make-camera-fixture.ts, scripts/camera_frame_stats.py, tests/camera_frame_stats_test.py, tests/camera_protocol_test.py, tests/camera_accessibility_test.py, scripts/camera_telemetry.py, tests/camera_telemetry_test.py, scripts/camera_surface_stats.py, tests/camera_surface_stats_test.py, scripts/android_fixture.py, tests/camera_fixture_test.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dominion-camera-checkpoint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CAMERA_CANDIDATE_RUNTIME: ca230dd129f5647d9f1a11fbbc42c78bd2344702
      CAMERA_FIXTURE_PATH: camera-fixture/camera-fixture-101.1.json
      CAMERA_CANDIDATE_RUN: '38047057931'
      CAMERA_REQUIRE_SURFACE_PRESENTATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require identical tested game runtime
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code ca230dd129f5647d9f1a11fbbc42c78bd2344702 HEAD -- App.tsx CampaignScreen.tsx app.json package.json package-lock.json src supabase/functions plugins assets
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/38047057931 > source-run.json
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/38047057931/jobs > source-jobs.json
          python -c "import json;r=json.load(open('source-run.json'));j=json.load(open('source-jobs.json'))['jobs'];assert r['head_sha']=='ca230dd129f5647d9f1a11fbbc42c78bd2344702';assert all(next(x for x in j if x['name']==n)['conclusion']=='success' for n in ['build-apk','long-simulation'])"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Generate one authoritative paused schema12 fixture for both APKs
        run: |
          git diff --exit-code 47b0db4f8b220e9ea89998afaac035239b64f5e0 ca230dd129f5647d9f1a11fbbc42c78bd2344702 -- supabase/functions/_shared src/persistence/campaignCodec.ts
          node --import tsx scripts/make-camera-fixture.ts camera-fixture
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - run: python -m py_compile scripts/android-camera-profile.py scripts/compare-camera-native.py scripts/export-camera-evidence.py
      - run: python -m unittest discover -s tests -p 'camera_*_test.py'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38047057931
          name: dominion-camera-illustrated-release
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37971350100
          name: dominion-camera-illustrated-release
          path: baseline-apk
      - name: Verify standalone checkpoint APK
        id: apk
        run: |
          python scripts/verify-apk.py Dominion-camera-optimized-illustrated.apk
          python scripts/verify-release.py Dominion-camera-optimized-illustrated.apk > checkpoint-integrity.txt
      - name: Compile identical real gesture driver
        id: gesture
        run: |
          mkdir -p camera-classes camera-dex
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d camera-classes scripts/CameraGesture.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output camera-dex camera-classes/CameraGesture.class
          cd camera-dex && zip ../dominion-camera.jar classes.dex
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb push dominion-camera.jar /data/local/tmp/dominion-camera.jar
            CAMERA_PROFILE_OUT=camera-before python scripts/android-camera-profile.py baseline-apk/Dominion-camera-optimized-illustrated.apk
            CAMERA_PROFILE_OUT=camera-after python scripts/android-camera-profile.py Dominion-camera-optimized-illustrated.apk
            forward_ok=0
            if python scripts/compare-camera-native.py camera-before/results.json camera-after/results.json; then forward_ok=1; fi
            cp CAMERA_NATIVE_PAIRED.json CAMERA_NATIVE_PAIRED_FORWARD.json
            CAMERA_PROFILE_OUT=camera-after-reverse python scripts/android-camera-profile.py Dominion-camera-optimized-illustrated.apk
            CAMERA_PROFILE_OUT=camera-before-reverse python scripts/android-camera-profile.py baseline-apk/Dominion-camera-optimized-illustrated.apk
            reverse_ok=0
            if python scripts/compare-camera-native.py camera-before-reverse/results.json camera-after-reverse/results.json; then reverse_ok=1; fi
            cp CAMERA_NATIVE_PAIRED.json CAMERA_NATIVE_PAIRED_REVERSE.json
            cp CAMERA_NATIVE_PAIRED_FORWARD.json CAMERA_NATIVE_PAIRED.json
            test "$forward_ok" = 1 && test "$reverse_ok" = 1
      - name: Install pinned host-only trace analyzer
        id: trace_tools
        if: always() && steps.source.outcome == 'success' && steps.apk.outcome == 'success' && steps.gesture.outcome == 'success'
        run: python -m pip install -r scripts/camera-trace-requirements.txt
      - name: Separate pinch system diagnostics; original camera gates above remain unchanged
        if: always() && steps.source.outcome == 'success' && steps.apk.outcome == 'success' && steps.gesture.outcome == 'success' && steps.trace_tools.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb push dominion-camera.jar /data/local/tmp/dominion-camera.jar
            CAMERA_TRACE_ONLY=1 CAMERA_PROFILE_OUT=trace-before python scripts/android-camera-profile.py baseline-apk/Dominion-camera-optimized-illustrated.apk
            python scripts/analyze-camera-trace.py trace-before
            CAMERA_TRACE_ONLY=1 CAMERA_PROFILE_OUT=trace-after python scripts/android-camera-profile.py Dominion-camera-optimized-illustrated.apk
            python scripts/analyze-camera-trace.py trace-after
      - name: Export verified native frames and original screenshots for remote review
        if: always()
        run: python scripts/export-camera-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-camera-paired-evidence
          path: |
            trace-before/
            trace-after/
            camera-before/
            camera-after/
            camera-before-reverse/
            camera-after-reverse/
            CAMERA_NATIVE_PAIRED.json
            CAMERA_NATIVE_PAIRED_FORWARD.json
            CAMERA_NATIVE_PAIRED_REVERSE.json
            EXPANSION_CAMERA_REVIEW.json
            checkpoint-integrity.txt
            camera-fixture/manifest.json
          retention-days: 14

name: Dominion same-APK camera checkpoint
on:
  push:
    branches: [expansion-camera-qa]
    paths: [.github/workflows/expansion-camera-checkpoint.yml, scripts/android-camera-profile.py, scripts/compare-camera-native.py, scripts/export-camera-evidence.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: dominion-camera-checkpoint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require identical tested game runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code efd1f3d4b63d737001ab6301b65bd151609b76af HEAD -- App.tsx CampaignScreen.tsx app.json package.json package-lock.json src supabase/functions plugins assets
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/37991163050 > source-run.json
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/37991163050/jobs > source-jobs.json
          python -c "import json;r=json.load(open('source-run.json'));j=json.load(open('source-jobs.json'))['jobs'];assert r['head_sha']=='efd1f3d4b63d737001ab6301b65bd151609b76af';assert all(next(x for x in j if x['name']==n)['conclusion']=='success' for n in ['build-apk','long-simulation'])"
      - name: Stop only superseded same-APK harness run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/37995218177 > superseded-run.json
          python -c "import json,subprocess;r=json.load(open('superseded-run.json'));assert r['head_sha']=='072e656c56c30114f67a130f50f25a791ea50757' and r['head_branch']=='expansion-camera-qa';subprocess.run(['gh','run','cancel','37995218177','--repo','elcin31/grand-strategy-multiplayer'],check=False) if r['status']!='completed' else None"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - run: python -m py_compile scripts/android-camera-profile.py scripts/compare-camera-native.py scripts/export-camera-evidence.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37991163050
          name: dominion-camera-illustrated-release
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37971350100
          name: dominion-camera-illustrated-release
          path: baseline-apk
      - name: Verify standalone checkpoint APK
        run: |
          python scripts/verify-apk.py Dominion-camera-optimized-illustrated.apk
          python scripts/verify-release.py Dominion-camera-optimized-illustrated.apk > checkpoint-integrity.txt
      - name: Compile identical real gesture driver
        run: |
          mkdir -p camera-classes camera-dex
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d camera-classes scripts/CameraGesture.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output camera-dex camera-classes/CameraGesture.class
          cd camera-dex && zip ../dominion-camera.jar classes.dex
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          CAMERA_CANDIDATE_RUNTIME: efd1f3d4b63d737001ab6301b65bd151609b76af
          CAMERA_CANDIDATE_RUN: '37991163050'
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb push dominion-camera.jar /data/local/tmp/dominion-camera.jar
            CAMERA_PROFILE_OUT=camera-before python scripts/android-camera-profile.py baseline-apk/Dominion-camera-optimized-illustrated.apk
            CAMERA_PROFILE_OUT=camera-after python scripts/android-camera-profile.py Dominion-camera-optimized-illustrated.apk
            python scripts/compare-camera-native.py camera-before/results.json camera-after/results.json
      - name: Export verified native frames and original screenshots for remote review
        if: always()
        run: python scripts/export-camera-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-camera-paired-evidence
          path: |
            camera-before/
            camera-after/
            CAMERA_NATIVE_PAIRED.json
            EXPANSION_CAMERA_REVIEW.json
            checkpoint-integrity.txt
          retention-days: 14

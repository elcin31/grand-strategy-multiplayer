name: Camera baseline native profile
on:
  push:
    branches: [camera-fix, camera-diagnostics]
    paths: [.github/workflows/camera-profile.yml, scripts/android-camera-profile.py, scripts/CameraGesture.java, scripts/map_paint_check.py, scripts/camera-profile-requirements.txt]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37918487336
          name: dominion-visual-release
      - name: Compile shell gesture driver
        run: |
          mkdir -p camera-classes camera-dex
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d camera-classes scripts/CameraGesture.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output camera-dex camera-classes/CameraGesture.class
          cd camera-dex && zip ../dominion-camera.jar classes.dex
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb push dominion-camera.jar /data/local/tmp/dominion-camera.jar && python scripts/android-camera-profile.py Dominion-visual-update-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-baseline-evidence
          path: camera-profile/
          retention-days: 14

name: Android checkpoint smoke
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Successful build run containing dominion-world-checkpoint
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require identical APK runtime sources
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        run: |
          if [ -z "$APK_RUN_ID" ]; then APK_RUN_ID=$(cat .github/android-smoke-source); fi
          echo "run_id=$APK_RUN_ID" >> "$GITHUB_OUTPUT"
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]]
          artifact_sha=$(gh api "repos/elcin31/grand-strategy-multiplayer/actions/runs/$APK_RUN_ID" --jq .head_sha)
          git diff --exit-code "$artifact_sha" HEAD -- App.tsx app.json package.json package-lock.json src supabase/functions plugins
      - uses: actions/download-artifact@v4
        with:
          name: dominion-world-checkpoint
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python scripts/android-smoke.py Dominion-world-checkpoint.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: android-smoke/
          retention-days: 14

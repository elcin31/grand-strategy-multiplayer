name: Full world stress
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Run 10000 authoritative full-world ticks
        run: npm run test:long > world-stress-report.txt
      - name: Preserve simulation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-world-stress-report
          path: |
            world-stress-report.txt
            LONG_SIMULATION_RESULTS.json
            long-simulation-failure.json
          if-no-files-found: warn
          retention-days: 14

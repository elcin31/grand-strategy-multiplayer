name: Publish Dominion playtest APK
on:
  push:
    branches: [dominion-2-playtest]
    paths:
      - .github/workflows/publish-playtest.yml
      - PLAYTEST_RELEASE_MANIFEST.json
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: dominion-2-playtest-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref != 'refs/heads/dominion-2.1-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: elcin31/grand-strategy-multiplayer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind unchanged runtime and original completed essential checks
        run: |
          git diff --exit-code a180f5851d47c717f9b8fa44e794070bcba625ef HEAD -- App.tsx CampaignScreen.tsx app.json package.json package-lock.json src supabase/functions plugins assets tests scripts
          gh api repos/$GH_REPO/actions/runs/38234126548 > original-run.json
          gh api 'repos/'"$GH_REPO"'/actions/runs/38234126548/jobs?per_page=30' > original-jobs.json
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('original-run.json').read_text())
          jobs=json.loads(Path('original-jobs.json').read_text())['jobs']
          manifest=json.loads(Path('PLAYTEST_RELEASE_MANIFEST.json').read_text())
          assert run['head_sha']==manifest['runtimeCommit']
          assert run['status']=='completed', 'Wait for the existing essential smoke; do not start a new performance run'
          required={'build-apk','long-simulation','backend-live / live-world','android-smoke','android-upgrade / release-upgrade-save','android-online / native-online'}
          selected=[job for job in jobs if job['name'] in required]
          assert {job['name'] for job in selected}==required
          assert all(job['status']=='completed' and job['conclusion']=='success' for job in selected), [(j['name'],j['conclusion']) for j in selected]
          camera=[job for job in jobs if job['name']=='camera-comparison']
          assert len(camera)==1 and camera[0]['status']=='completed'
          print('PASS: exact original release and essential checks. Camera result remains',camera[0]['conclusion'],'and is deliberately non-blocking for this playtest.')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: dominion-camera-illustrated-release
          run-id: 38234126548
          github-token: ${{ github.token }}
          path: release
      - name: Verify exact standalone APK without rebuilding
        run: |
          python scripts/verify-apk.py release/Dominion-grand-strategy-v2-release.apk
          python scripts/verify-packaged-art.py release/Dominion-grand-strategy-v2-release.apk
          python scripts/verify-release.py release/Dominion-grand-strategy-v2-release.apk > release/playtest-integrity.txt
          python - <<'PY'
          import hashlib,json,os,zipfile,shutil
          from pathlib import Path
          manifest=json.loads(Path('PLAYTEST_RELEASE_MANIFEST.json').read_text())
          original=Path('release/Dominion-grand-strategy-v2-release.apk')
          assert original.stat().st_size==manifest['apk']['bytes']
          assert hashlib.sha256(original.read_bytes()).hexdigest()==manifest['apk']['sha256']
          with zipfile.ZipFile(original) as z:
              assert z.testzip() is None
              assert z.read('assets/index.android.bundle')[:8].hex()=='c61fbc03c103191f'
          shutil.copyfile(original,'release/Dominion-2.0-playtest.apk')
          manifest['finalCommit']=os.environ['GITHUB_SHA']
          manifest['publicationRunId']=int(os.environ['GITHUB_RUN_ID'])
          manifest['publicationStatus']='PUBLISHED_PLAYTEST_WITH_DEFERRED_CAMERA_ISSUE'
          jobs=json.loads(Path('original-jobs.json').read_text())['jobs']
          manifest['originalJobResults']=[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j['conclusion']} for j in jobs]
          Path('release/PLAYTEST_RELEASE_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('release/Dominion-2.0-playtest.sha256').write_text(manifest['apk']['sha256']+'  Dominion-2.0-playtest.apk\n')
          notes=Path('RELEASE_NOTES_PLAYTEST.md').read_text()
          notes+='\nFinal publication commit: '+os.environ['GITHUB_SHA']+'\n'
          Path('publish-notes.md').write_text(notes)
          PY
      - name: Publish prerelease and checkpoint tag in the existing Dominion repository
        run: |
          gh release create v2.0.0-playtest.1 --target "$GITHUB_SHA" --prerelease --title 'Dominion 2.0 — Playtest' --notes-file publish-notes.md release/Dominion-2.0-playtest.apk release/Dominion-2.0-playtest.sha256 release/PLAYTEST_RELEASE_MANIFEST.json release/playtest-integrity.txt
      - name: Verify actual public APK bytes
        run: |
          curl --fail --location --retry 2 --max-time 180 'https://github.com/elcin31/grand-strategy-multiplayer/releases/download/v2.0.0-playtest.1/Dominion-2.0-playtest.apk' -o public-playtest.apk
          cmp release/Dominion-2.0-playtest.apk public-playtest.apk
          gh release view v2.0.0-playtest.1 --json url,tagName,assets
      - uses: actions/upload-artifact@v4
        with:
          name: dominion-2-playtest-release-checkpoint
          path: |
            release/Dominion-2.0-playtest.apk
            release/Dominion-2.0-playtest.sha256
            release/PLAYTEST_RELEASE_MANIFEST.json
            release/playtest-integrity.txt
          retention-days: 30
  publish21:
    if: github.ref == 'refs/heads/dominion-2.1-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: elcin31/grand-strategy-multiplayer
      DOMINION21_RUNTIME_SHA: 08a754500de131c6b0a8947e5cd217e68e52604a
      DOMINION21_BUILD_RUN: '38276146685'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact successful release and short native smoke
        run: |
          git diff --exit-code "$DOMINION21_RUNTIME_SHA" HEAD -- App.tsx CampaignScreen.tsx app.json package.json package-lock.json src supabase/functions plugins assets tests scripts
          gh api "repos/$GH_REPO/actions/runs/$DOMINION21_BUILD_RUN" > original-run.json
          gh api "repos/$GH_REPO/actions/runs/$DOMINION21_BUILD_RUN/jobs?per_page=30" > original-jobs.json
          gh release view v2.0.0-playtest.1 --json assets > preserved20.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('DOMINION_21_RELEASE_MANIFEST.json').read_text())
          r=json.loads(Path('original-run.json').read_text())
          jobs=json.loads(Path('original-jobs.json').read_text())['jobs']
          assert r['head_sha']==m['runtimeCommit']==os.environ['DOMINION21_RUNTIME_SHA']
          assert r['status']=='completed' and r['conclusion']=='success'
          required={'build-apk','android-lean-smoke'}
          selected=[j for j in jobs if j['name'] in required]
          assert {j['name'] for j in selected}==required
          assert all(j['status']=='completed' and j['conclusion']=='success' for j in selected)
          assert m['verification']['leanTests']=={'tests':38,'passed':38,'failed':0}
          print('PASS: unchanged runtime, successful release, 38 lean checks and short native smoke')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: dominion-camera-illustrated-release
          run-id: 38276146685
          github-token: ${{ github.token }}
          path: release
      - name: Verify and prepare the same APK without rebuilding
        run: |
          python scripts/verify-release.py release/Dominion-2.1-playtest.apk > release/dominion21-integrity.txt
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          m=json.loads(Path('DOMINION_21_RELEASE_MANIFEST.json').read_text())
          apk=Path('release/Dominion-2.1-playtest.apk')
          assert apk.stat().st_size==m['apk']['bytes']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==m['apk']['sha256']
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert z.read('assets/index.android.bundle')[:8].hex()=='c61fbc03c103191f'
          Path('release/Dominion-2.1-playtest.apk.sha256').write_text(m['apk']['sha256']+'  Dominion-2.1-playtest.apk\n')
          PY
      - name: Package a smaller ZIP download with the identical signed APK
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          m=json.loads(Path('DOMINION_21_RELEASE_MANIFEST.json').read_text())
          root=Path('release');apk=root/'Dominion-2.1-playtest.apk'
          archive=root/'Dominion-2.1-playtest.zip'
          entries={apk.name:apk.read_bytes(),apk.name+'.sha256':(root/(apk.name+'.sha256')).read_bytes(),'README.txt':'Dominion 2.1 Playtest\n\nРаспакуйте архив в менеджере файлов телефона.\nОткройте Dominion-2.1-playtest.apk для установки.\n'.encode('utf-8')}
          with zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for name,data in entries.items():
                  info=zipfile.ZipInfo(name,date_time=(2026,10,12,0,0,0));info.external_attr=0o100644<<16
                  z.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=6)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read(apk.name)).hexdigest()==m['apk']['sha256']
          identity={'name':archive.name,'bytes':archive.stat().st_size,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'embeddedApkSha256':m['apk']['sha256'],'url':'https://github.com/elcin31/grand-strategy-multiplayer/releases/download/v2.1.0-playtest.1/'+archive.name}
          (root/(archive.name+'.sha256')).write_text(identity['sha256']+'  '+archive.name+'\n')
          (root/'zip-download.json').write_text(json.dumps(identity,indent=2)+'\n')
          print(json.dumps(identity))
          PY
      - name: Publish only the new Dominion 2.1 prerelease
        run: |
          if gh release view v2.1.0-playtest.1 >/dev/null 2>&1; then
            gh release download v2.1.0-playtest.1 --pattern Dominion-2.1-playtest.apk --dir existing-release
            cmp release/Dominion-2.1-playtest.apk existing-release/Dominion-2.1-playtest.apk
          else
            gh release create v2.1.0-playtest.1 release/Dominion-2.1-playtest.apk release/Dominion-2.1-playtest.apk.sha256 --target "$DOMINION21_RUNTIME_SHA" --prerelease --title 'Dominion 2.1 — Grand Strategy Overhaul (Playtest)' --notes-file RELEASE_NOTES_21.md
          fi
      - name: Add the ZIP alternative without replacing the published APK
        run: |
          if gh release view v2.1.0-playtest.1 --json assets --jq '.assets[].name' | rg -Fxq 'Dominion-2.1-playtest.zip'; then
            gh release download v2.1.0-playtest.1 --pattern Dominion-2.1-playtest.zip --dir existing-zip
            cmp release/Dominion-2.1-playtest.zip existing-zip/Dominion-2.1-playtest.zip
          else
            gh release upload v2.1.0-playtest.1 release/Dominion-2.1-playtest.zip release/Dominion-2.1-playtest.zip.sha256
          fi
          curl --fail --location --retry 2 --max-time 180 'https://github.com/elcin31/grand-strategy-multiplayer/releases/download/v2.1.0-playtest.1/Dominion-2.1-playtest.zip' -o public-playtest.zip
          cmp release/Dominion-2.1-playtest.zip public-playtest.zip
      - name: Verify concrete public APK bytes and preserve Dominion 2.0
        run: |
          curl --fail --location --retry 2 --max-time 180 'https://github.com/elcin31/grand-strategy-multiplayer/releases/download/v2.1.0-playtest.1/Dominion-2.1-playtest.apk' -o public-playtest.apk
          cmp release/Dominion-2.1-playtest.apk public-playtest.apk
          gh api "repos/$GH_REPO/releases/tags/v2.1.0-playtest.1" > published21.json
          gh release view v2.0.0-playtest.1 --json assets > after20.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          before=json.loads(Path('preserved20.json').read_text())
          after=json.loads(Path('after20.json').read_text())
          assert before==after, 'Dominion 2.0 assets changed during publication'
          m=json.loads(Path('DOMINION_21_RELEASE_MANIFEST.json').read_text())
          r=json.loads(Path('published21.json').read_text())
          apk=next(a for a in r['assets'] if a['name']=='Dominion-2.1-playtest.apk')
          assert not r['draft'] and r['prerelease'] and apk['state']=='uploaded'
          assert apk['size']==m['apk']['bytes']
          assert apk['digest']=='sha256:'+m['apk']['sha256']
          archive=json.loads(Path('release/zip-download.json').read_text())
          asset=next(a for a in r['assets'] if a['name']==archive['name'])
          assert asset['state']=='uploaded' and asset['size']==archive['bytes'] and asset['digest']=='sha256:'+archive['sha256']
          archive.update(assetId=asset['id'],publicByteMatch=True)
          m['downloadArchive']=archive
          m.update(publicationStatus='PUBLISHED_VERIFIED',publicationRunId=int(os.environ['GITHUB_RUN_ID']),publicationCommit=os.environ['GITHUB_SHA'],releaseId=r['id'],apkAssetId=apk['id'],publicApkByteMatch=True,original20AssetsPreserved=True)
          Path('release/DOMINION_21_RELEASE_MANIFEST.json').write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          PY
          gh release upload v2.1.0-playtest.1 release/DOMINION_21_RELEASE_MANIFEST.json release/dominion21-integrity.txt --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-21-publication-checkpoint
          path: |
            release/DOMINION_21_RELEASE_MANIFEST.json
            release/dominion21-integrity.txt
            release/zip-download.json
            published21.json
          retention-days: 30

name: Dominion 2.3 immutable APK interaction and monthly simulation checks
on:
  push:
    branches: [dominion-2.3-performance]
    paths: [.github/workflows/dominion23-validation.yml]
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Run containing the verified performance candidate APK
        required: true
        type: string
      lod_only:
        description: Supplement the continuous gestures with actual staged world/region/province switching
        type: boolean
        default: false
      full_matrix_only:
        description: Repeat complete A-I using the immutable compiled APK without rebuilding
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Pin the already verified binary to unchanged runtime inputs
        env: {GH_TOKEN: '${{ github.token }}', APK_RUN_ID: '${{ inputs.apk_run_id }}'}
        run: |
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]]
          source_sha=$(gh api "repos/elcin31/grand-strategy-multiplayer/actions/runs/$APK_RUN_ID" --jq .head_sha)
          git diff --exit-code "$source_sha" HEAD -- App.tsx CampaignScreen.tsx app.json package.json package-lock.json metro.config.js babel.config.js src supabase/functions plugins assets
          gh api "repos/elcin31/grand-strategy-multiplayer/actions/runs/$APK_RUN_ID/jobs" --jq '.jobs[]|select(.name=="build-candidate")|.conclusion' > build-status.txt
          test "$(cat build-status.txt)" = success
      - uses: actions/download-artifact@v4
        with:
          name: dominion23-performance-candidate
          run-id: '${{ inputs.apk_run_id }}'
          github-token: '${{ github.token }}'
      - run: npm ci --include=dev --no-audit --no-fund
      - run: node --import tsx scripts/make-camera23-fixture.ts camera23-monthly-fixture --monthly
      - run: python -m pip install -r scripts/camera-profile-requirements.txt -r scripts/camera-trace-requirements.txt
      - name: Check the downloaded binary again; prepare original and new real-pointer drivers
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python scripts/verify-apk.py Dominion-2.3-performance-candidate.apk
          python scripts/verify-release.py Dominion-2.3-performance-candidate.apk > candidate-integrity.txt
          gh release download v2.2.1-performance-hotfix -R elcin31/grand-strategy-multiplayer -D baseline-apk -p Dominion-2.2.1-performance-hotfix.apk
          echo 'a44c54b3fcbe31dd7c23d5fea13782244436a6e47a7fa3ddf50be1204e846cbb  baseline-apk/Dominion-2.2.1-performance-hotfix.apk' | sha256sum --check
          for driver in CameraGesture CameraGesture23; do
            mkdir -p "$driver-classes" "$driver-dex"
            javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d "$driver-classes" "scripts/$driver.java"
            "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output "$driver-dex" "$driver-classes/$driver.class"
            (cd "$driver-dex" && zip "../$driver.jar" classes.dex)
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env: {LOD_ONLY: '${{ inputs.lod_only }}', FULL_MATRIX_ONLY: '${{ inputs.full_matrix_only }}'}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android23-validation.sh
      - name: Analyze complete actual LOD frames, excluding synthetic idle-interval claims
        if: always() && inputs.lod_only == true
        run: |
          python scripts/analyze-camera23-lod.py lod-baseline/diagnostic-lod
          python scripts/analyze-camera23-lod.py lod-candidate/diagnostic-lod
      - name: Require the completed matrix metric gate
        if: success() && inputs.full_matrix_only == true
        run: python scripts/compare-camera23.py profile-baseline profile-candidate --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion23-immutable-apk-validation
          path: |
            android-hotfix/
            monthly-baseline/
            monthly-candidate/
            lod-baseline/
            lod-candidate/
            profile-baseline/
            profile-candidate/
            camera23-comparison.json
            candidate-integrity.txt
            camera23-monthly-fixture/manifest.json
          retention-days: 30

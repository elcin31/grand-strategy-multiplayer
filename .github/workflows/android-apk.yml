name: Android Dominion visual release
on:
  push:
    branches: [main, world-update, performance-pass-2, performance-pass-3, visual-update]
    paths-ignore:
      - "**/*.md"
      - .github/workflows/android-checkpoint-smoke.yml
      - .github/android-smoke-source
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: '1'
jobs:
  long-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Require 10000 authoritative ticks before release build
        run: npm run test:long > world-stress-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-long-simulation-evidence
          path: |
            world-stress-report.txt
            LONG_SIMULATION_RESULTS.json
            long-simulation-failure.json
          retention-days: 14
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Install world-import test dependency
        run: python -m pip install -r scripts/world-requirements.txt
      - name: APK verifier and world importer regression tests
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Validate original optimized illustrations
        run: npm run verify:art
      - name: Paired visual update benchmark
        run: npm run benchmark:visual > paired-visual-ci.json
      - name: Map geometry benchmark
        run: npm run benchmark:map
      - name: Full-world data benchmark
        run: npm run benchmark:world
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Verify native landscape configuration
        run: python scripts/verify-native-config.py
      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          NODE_ENV=production ./gradlew assembleRelease --no-daemon
      - name: Verify bundled JavaScript and native libraries
        run: python scripts/verify-apk.py android/app/build/outputs/apk/release/app-release.apk
      - name: Verify release manifest, signature and production backend
        run: |
          python scripts/verify-release.py android/app/build/outputs/apk/release/app-release.apk > release-integrity.txt
          sha256sum android/app/build/outputs/apk/release/app-release.apk >> release-integrity.txt
      - name: Package final release
        run: cp android/app/build/outputs/apk/release/app-release.apk Dominion-visual-update-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dominion-visual-release
          path: |
            Dominion-visual-update-release.apk
            release-integrity.txt
            paired-visual-ci.json
          if-no-files-found: error
          retention-days: 14
  android-smoke:
    needs: [build-apk, long-simulation]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dominion-visual-release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: DOMINION_STRESS_SECONDS=1800 python scripts/android-smoke.py Dominion-visual-update-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: android-smoke/
          retention-days: 14

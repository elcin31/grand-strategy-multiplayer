name: Android Dominion standalone release
on:
  push:
    branches: [main, world-update, performance-pass-2, performance-pass-3, visual-update, camera-fix, expansion-v2]
    paths-ignore:
      - "**/*.md"
      - .github/workflows/android-checkpoint-smoke.yml
      - .github/android-smoke-source
      - .github/workflows/expansion-native-checkpoint.yml
      - .github/expansion-apk-source
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CI: '1'
concurrency:
  # Preserve a completed stage's running native/30-minute evidence when the
  # next logical stage is saved. Each commit still executes its own full gates.
  group: dominion-camera-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  backend-live:
    if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
    uses: ./.github/workflows/backend-world-qa.yml
  long-simulation:
    if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Require 10000 authoritative ticks before release build
        run: npm run test:long > world-stress-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-long-simulation-evidence
          path: |
            world-stress-report.txt
            LONG_SIMULATION_RESULTS.json
            long-simulation-failure.json
          retention-days: 14
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Compile existing Dominion backend functions for coordinated rollout
        if: github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
        run: node scripts/bundle-backend.mjs backend-bundles
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
        with:
          name: dominion-backend-bundles
          path: backend-bundles/
          if-no-files-found: error
          retention-days: 14
      - name: Gameplay and authority checks
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/dominion-2.2.1-performance-hotfix' ]; then
            npm run test:221
          elif [ "$GITHUB_REF" = 'refs/heads/dominion-2.2-world-map-overhaul' ]; then
            npm run test:22
          elif [ "$GITHUB_REF" = 'refs/heads/dominion-2.1.2-living-world' ]; then
            npm run test:212
          elif [ "$GITHUB_REF" = 'refs/heads/dominion-2.1.1-warfare-interface-art' ]; then
            npm run test:211
          elif [ "$GITHUB_REF" = 'refs/heads/dominion-2.1-overhaul' ]; then
            npm run test:lean
          else
            npm test
          fi
      - name: Install world-import test dependency
        if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
        run: python -m pip install -r scripts/world-requirements.txt
      - name: APK verifier and world importer regression tests
        if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
        # Native screenshot checks use the same pinned decoder as Python tests.
        run: |
          python -m pip install -r scripts/camera-profile-requirements.txt -r scripts/camera-trace-requirements.txt
          python -m unittest discover -s tests -p '*_test.py'
      - name: Install artwork verification dependency
        run: python -m pip install -r scripts/camera-profile-requirements.txt
      - name: Validate original optimized illustrations
        run: |
          npm run verify:art
          if [ "$GITHUB_REF" = 'refs/heads/dominion-2.2-world-map-overhaul' ]; then python scripts/verify-map22.py; fi
          if [ "$GITHUB_REF" = 'refs/heads/dominion-2.1.1-warfare-interface-art' ]; then npm run verify:art211; fi
      - name: Paired visual update benchmark
        if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
        run: npm run benchmark:visual > paired-visual-ci.json
      - name: Paired camera selectors and coverage benchmark
        if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
        run: npm run benchmark:camera > paired-camera-ci.json
      - name: Map geometry benchmark
        if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
        run: npm run benchmark:map
      - name: Full-world data benchmark
        if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
        run: npm run benchmark:world
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Verify native landscape configuration
        run: |
          python scripts/verify-native-config.py
          if [ "$GITHUB_REF" = 'refs/heads/dominion-2.2.1-performance-hotfix' ]; then python scripts/verify-hotfix-assets.py --native; fi
      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          NODE_ENV=production ./gradlew assembleRelease --no-daemon
      - name: Verify bundled JavaScript and native libraries
        run: |
          python scripts/verify-apk.py android/app/build/outputs/apk/release/app-release.apk
          python scripts/verify-packaged-art.py android/app/build/outputs/apk/release/app-release.apk > art-packaging.txt
      - name: Verify release manifest, signature and production backend
        run: |
          python scripts/verify-release.py android/app/build/outputs/apk/release/app-release.apk > release-integrity.txt
          sha256sum android/app/build/outputs/apk/release/app-release.apk >> release-integrity.txt
      - name: Package final release
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/dominion-2.2.1-performance-hotfix' ]; then
            python scripts/verify-map22.py android/app/build/outputs/apk/release/app-release.apk
            python scripts/verify-hotfix-assets.py android/app/build/outputs/apk/release/app-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk Dominion-2.2.1-performance-hotfix.apk
          elif [ "$GITHUB_REF" = 'refs/heads/dominion-2.2-world-map-overhaul' ]; then
            python scripts/verify-map22.py android/app/build/outputs/apk/release/app-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk Dominion-2.2-playtest.apk
          elif [ "$GITHUB_REF" = 'refs/heads/dominion-2.1.2-living-world' ]; then
            python scripts/verify-art211.py android/app/build/outputs/apk/release/app-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk Dominion-2.1.2-playtest.apk
          elif [ "$GITHUB_REF" = 'refs/heads/dominion-2.1.1-warfare-interface-art' ]; then
            python scripts/verify-art211.py android/app/build/outputs/apk/release/app-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk Dominion-2.1.1-playtest.apk
          elif [ "$GITHUB_REF" = 'refs/heads/dominion-2.1-overhaul' ]; then
            cp android/app/build/outputs/apk/release/app-release.apk Dominion-2.1-playtest.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk Dominion-grand-strategy-v2-release.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dominion-camera-illustrated-release
          path: |
            Dominion-grand-strategy-v2-release.apk
            Dominion-2.1-playtest.apk
            Dominion-2.1.1-playtest.apk
            Dominion-2.1.2-playtest.apk
            Dominion-2.2-playtest.apk
            Dominion-2.2.1-performance-hotfix.apk
            android/launcher-icon-proof.json
            release-integrity.txt
            art-packaging.txt
            paired-visual-ci.json
            paired-camera-ci.json
            CAMERA_HOST_PAIRED.json
            android/map-texture-opacity.json
            android/skia-recorder-lifecycle.json
          if-no-files-found: error
          retention-days: 14
  android-lean-smoke:
    if: github.ref == 'refs/heads/dominion-2.1-overhaul' || github.ref == 'refs/heads/dominion-2.1.1-warfare-interface-art' || github.ref == 'refs/heads/dominion-2.1.2-living-world' || github.ref == 'refs/heads/dominion-2.2-world-map-overhaul' || github.ref == 'refs/heads/dominion-2.2.1-performance-hotfix'
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dominion-camera-illustrated-release
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - name: Prepare short hotfix comparison
        if: github.ref == 'refs/heads/dominion-2.2.1-performance-hotfix'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.2-playtest.1 --repo elcin31/grand-strategy-multiplayer --pattern Dominion-2.2-playtest.apk --dir baseline-apk
          echo '0fe6ae3b6125517a59518c0cb0bfca0b5b8983ebbbd253b9ffcf3c822dc6bd17  baseline-apk/Dominion-2.2-playtest.apk' | sha256sum --check
          mkdir -p camera-classes camera-dex
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d camera-classes scripts/CameraGesture.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output camera-dex camera-classes/CameraGesture.class
          cd camera-dex && zip ../dominion-camera.jar classes.dex
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: if [ "$GITHUB_REF" = 'refs/heads/dominion-2.2.1-performance-hotfix' ]; then adb push dominion-camera.jar /data/local/tmp/dominion-camera.jar && python scripts/android221-smoke.py baseline-apk/Dominion-2.2-playtest.apk Dominion-2.2.1-performance-hotfix.apk; elif [ "$GITHUB_REF" = 'refs/heads/dominion-2.2-world-map-overhaul' ]; then python scripts/android22-smoke.py Dominion-2.2-playtest.apk; elif [ "$GITHUB_REF" = 'refs/heads/dominion-2.1.2-living-world' ]; then python scripts/android211-smoke.py Dominion-2.1.2-playtest.apk; elif [ "$GITHUB_REF" = 'refs/heads/dominion-2.1.1-warfare-interface-art' ]; then python scripts/android211-smoke.py Dominion-2.1.1-playtest.apk; else python scripts/android-lean-smoke.py Dominion-2.1-playtest.apk; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dominion-21-short-native-smoke
          path: |
            android-lean-smoke/
            android-hotfix/
          retention-days: 14

  android-smoke:
    if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
    needs: [build-apk, long-simulation]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dominion-camera-illustrated-release
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: DOMINION_EXPECT_MAP_BACKEND=texture DOMINION_STRESS_SECONDS=1800 python scripts/android-smoke.py Dominion-grand-strategy-v2-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: android-smoke/
          retention-days: 14

  camera-comparison:
    if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Generate the same paused schema12 campaign for both APKs
        run: |
          git diff --exit-code 47b0db4f8b220e9ea89998afaac035239b64f5e0 HEAD -- supabase/functions/_shared/worldDefinitions.ts supabase/functions/_shared/worldData
          fixture_source="$RUNNER_TEMP/dominion-accepted-fixture"
          git worktree add --detach "$fixture_source" 47b0db4f8b220e9ea89998afaac035239b64f5e0
          cp scripts/make-camera-fixture.ts "$fixture_source/scripts/make-camera-fixture.ts"
          node --import tsx "$fixture_source/scripts/make-camera-fixture.ts" "$GITHUB_WORKSPACE/camera-fixture"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: dominion-camera-illustrated-release
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37971350100
          name: dominion-camera-illustrated-release
          path: baseline-apk
      - name: Compile identical real gesture driver
        run: |
          mkdir -p camera-classes camera-dex
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d camera-classes scripts/CameraGesture.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output camera-dex camera-classes/CameraGesture.class
          cd camera-dex && zip ../dominion-camera.jar classes.dex
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          CAMERA_FIXTURE_PATH: camera-fixture/camera-fixture-101.1.json
          CAMERA_ALLOWED_STATE_VERSION: '18'
          CAMERA_REQUIRE_SURFACE_PRESENTATION: '1'
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb push dominion-camera.jar /data/local/tmp/dominion-camera.jar
            CAMERA_PROFILE_OUT=camera-before python scripts/android-camera-profile.py baseline-apk/Dominion-camera-optimized-illustrated.apk
            CAMERA_PROFILE_OUT=camera-after python scripts/android-camera-profile.py Dominion-grand-strategy-v2-release.apk
            CAMERA_PROFILE_OUT=camera-after-reverse python scripts/android-camera-profile.py Dominion-grand-strategy-v2-release.apk
            CAMERA_PROFILE_OUT=camera-before-reverse python scripts/android-camera-profile.py baseline-apk/Dominion-camera-optimized-illustrated.apk
            python scripts/compare-camera-orders.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-native-paired-evidence
          path: |
            camera-before/
            camera-after/
            camera-before-reverse/
            camera-after-reverse/
            CAMERA_NATIVE_PAIRED.json
            CAMERA_NATIVE_PAIRED_FORWARD.json
            CAMERA_NATIVE_PAIRED_REVERSE.json
            CAMERA_ABBA_QA.json
            camera-fixture/manifest.json
          retention-days: 14
  android-upgrade:
    if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
    needs: [build-apk, long-simulation]
    uses: ./.github/workflows/android-upgrade-qa.yml
    with:
      apk_run_id: ${{ github.run_id }}
      require_version_upgrade: true
  android-online:
    if: github.ref != 'refs/heads/dominion-2.1-overhaul' && github.ref != 'refs/heads/dominion-2.1.1-warfare-interface-art' && github.ref != 'refs/heads/dominion-2.1.2-living-world' && github.ref != 'refs/heads/dominion-2.2-world-map-overhaul' && github.ref != 'refs/heads/dominion-2.2.1-performance-hotfix'
    needs: [build-apk, long-simulation]
    uses: ./.github/workflows/android-online-qa.yml
    with:
      apk_run_id: ${{ github.run_id }}
  publish-release:
    needs: [build-apk, long-simulation, android-smoke, camera-comparison, android-upgrade, android-online, backend-live]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dominion-camera-illustrated-release
      - uses: actions/download-artifact@v4
        with:
          name: camera-native-paired-evidence
          path: camera-evidence
      - uses: actions/download-artifact@v4
        with:
          name: dominion-upgrade-save-evidence
          path: upgrade-evidence
      - uses: actions/download-artifact@v4
        with:
          name: dominion-native-online-evidence
          path: online-evidence
      - name: Publish the tested standalone APK and verified ZIP fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/elcin31/grand-strategy-multiplayer/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          python -c "import json,os;r=json.load(open('upgrade-evidence/candidate-run.json'));assert r['head_sha']==os.environ['GITHUB_SHA'];u=json.load(open('upgrade-evidence/android-upgrade/UPGRADE_SAVE_QA.json'));assert u['finalVersionUpgrade'] is True;assert u['candidate']['versionCode']>u['baseline']['versionCode']"
          python -c "import json;import sys;sys.path.insert(0,'scripts');from release_v2_validation import read_evidence;r=read_evidence('online-evidence','NATIVE_ONLINE_QA.json');assert all(r[k] is True for k in ['nativeCreate','serverPaused','menuReconnect','processReconnect','realHostMigration','nativeOwnerReturn','rebootReconnect','sameNativeUidAndSessionKeys','onceOnlyFocusPaymentRetained'])"
          cp camera-evidence/CAMERA_NATIVE_PAIRED.json .
          python -c "import shutil; shutil.make_archive('camera-native-evidence', 'zip', 'camera-evidence')"
          zip Dominion-grand-strategy-v2-release.zip Dominion-grand-strategy-v2-release.apk
          sha256sum Dominion-grand-strategy-v2-release.apk Dominion-grand-strategy-v2-release.zip > dominion-v2-checksums.txt
          gh release create v2.0.0 --target "$GITHUB_SHA" --title 'Dominion 2.0 — Grand Strategy Expansion' --notes 'Standalone Android release with embedded Hermes JavaScript and the existing Dominion backend. Diplomacy, espionage, economy/construction, military/supply, technology tree and national courses; 27 new original illustrations. Includes authoritative long-simulation, native gameplay/stress, camera comparison, in-place 0.8.1→2.0 upgrade and real native multiplayer reconnect gates. Physical Redmi smoothness awaits user testing.' Dominion-grand-strategy-v2-release.apk Dominion-grand-strategy-v2-release.zip dominion-v2-checksums.txt release-integrity.txt CAMERA_NATIVE_PAIRED.json camera-native-evidence.zip
          curl --fail --location --retry 3 'https://github.com/elcin31/grand-strategy-multiplayer/releases/download/v2.0.0/Dominion-grand-strategy-v2-release.apk' -o verified-public.apk
          cmp Dominion-grand-strategy-v2-release.apk verified-public.apk

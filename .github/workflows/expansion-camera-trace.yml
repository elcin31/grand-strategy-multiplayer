name: Dominion auxiliary terrain and closed-panel CPU traces
on:
  push:
    branches: [expansion-camera-qa]
    paths: [.github/workflows/expansion-camera-trace.yml, scripts/analyze-camera-cpu.py, scripts/camera_system_trace.py, scripts/camera_trace_scenarios.py, scripts/camera_trace_analysis.py, scripts/analyze-camera-trace.py, scripts/camera-trace-requirements.txt, scripts/camera_capture_validation.py, scripts/verify-camera-capture.py, tests/camera_capture_validation_test.py, tests/camera_system_trace_test.py, tests/camera_trace_scenarios_test.py, tests/camera_trace_analysis_test.py, tests/camera_trace_sql_integration_test.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dominion-camera-trace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pan-system-diagnostics:
    # A matched auxiliary trace is explicitly requested after a failed original
    # camera gate; a new renderer implementation must use source/full QA first.
    if: contains(github.event.head_commit.message, '[trace-only]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAMERA_CANDIDATE_RUNTIME: 6f5c111f3eb4f9d22667036ccbcb8c96583fe3c2
      CAMERA_FIXTURE_PATH: camera-fixture/camera-fixture-101.1.json
      CAMERA_CANDIDATE_RUN: '38208776998'
      CAMERA_ALLOWED_STATE_VERSION: '18'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require identical tested game runtime
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code 6f5c111f3eb4f9d22667036ccbcb8c96583fe3c2 HEAD -- App.tsx CampaignScreen.tsx app.json package.json package-lock.json src supabase/functions plugins assets
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/38208776998 > source-run.json
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/38208776998/jobs > source-jobs.json
          python -c "import json;r=json.load(open('source-run.json'));j=json.load(open('source-jobs.json'))['jobs'];assert r['head_sha']=='6f5c111f3eb4f9d22667036ccbcb8c96583fe3c2';assert all(next(x for x in j if x['name']==n)['conclusion']=='success' for n in ['build-apk','long-simulation'])"
      - name: Require completed paired capture job and preserve its failure status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/38208776998 > paired-run.json
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/38208776998/jobs > paired-jobs.json
          python -c "import json;r=json.load(open('paired-run.json'));j=json.load(open('paired-jobs.json'))['jobs'];assert r['head_sha']=='6f5c111f3eb4f9d22667036ccbcb8c96583fe3c2';c=next(x for x in j if x['name']=='camera-comparison');assert c['status']=='completed';assert c['conclusion']=='failure'"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Generate one authoritative paused schema12 fixture for both APKs
        run: |
          git diff --exit-code 47b0db4f8b220e9ea89998afaac035239b64f5e0 HEAD -- supabase/functions/_shared/worldDefinitions.ts supabase/functions/_shared/worldData
          fixture_source="$RUNNER_TEMP/dominion-accepted-trace-fixture"
          git worktree add --detach "$fixture_source" 47b0db4f8b220e9ea89998afaac035239b64f5e0
          cp scripts/make-camera-fixture.ts "$fixture_source/scripts/make-camera-fixture.ts"
          node --import tsx "$fixture_source/scripts/make-camera-fixture.ts" "$GITHUB_WORKSPACE/camera-fixture"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - run: python -m py_compile scripts/android-camera-profile.py scripts/compare-camera-native.py scripts/export-camera-evidence.py scripts/analyze-camera-cpu.py
      - run: python -m pip install -r scripts/camera-trace-requirements.txt
      - run: python -m unittest discover -s tests -p 'camera_*_test.py'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38208776998
          name: dominion-camera-illustrated-release
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37971350100
          name: dominion-camera-illustrated-release
          path: baseline-apk
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38208776998
          name: camera-native-paired-evidence
          path: paired-evidence
      - name: Require all four actual complete captures before separate diagnostics
        run: python scripts/verify-camera-capture.py paired-evidence camera-fixture/camera-fixture-101.1.json > paired-capture-validation.json
      - name: Verify standalone checkpoint APK
        id: apk
        run: |
          python scripts/verify-apk.py Dominion-grand-strategy-v2-release.apk
          python scripts/verify-release.py Dominion-grand-strategy-v2-release.apk > checkpoint-integrity.txt
          python -c "import hashlib;assert hashlib.sha256(open('Dominion-grand-strategy-v2-release.apk','rb').read()).hexdigest()=='595b39364782344b7d2ee72809ca6bab91977ed72ef3868351cb90b75923b140'"
      - name: Compile identical real gesture driver
        id: gesture
        run: |
          mkdir -p camera-classes camera-dex
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d camera-classes scripts/CameraGesture.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output camera-dex camera-classes/CameraGesture.class
          cd camera-dex && zip ../dominion-camera.jar classes.dex
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Separate trace-only launches; no benchmark frames are retested or replaced
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb push dominion-camera.jar /data/local/tmp/dominion-camera.jar
            CAMERA_TRACE_ONLY=1 CAMERA_TRACE_SCENARIO=terrain-pan CAMERA_PROFILE_OUT=trace-before-terrain python scripts/android-camera-profile.py baseline-apk/Dominion-camera-optimized-illustrated.apk
            CAMERA_TRACE_ONLY=1 CAMERA_TRACE_SCENARIO=terrain-pan CAMERA_PROFILE_OUT=trace-after-terrain python scripts/android-camera-profile.py Dominion-grand-strategy-v2-release.apk
            CAMERA_TRACE_ONLY=1 CAMERA_TRACE_SCENARIO=panel-closed-pan CAMERA_PROFILE_OUT=trace-before-closed python scripts/android-camera-profile.py baseline-apk/Dominion-camera-optimized-illustrated.apk
            CAMERA_TRACE_ONLY=1 CAMERA_TRACE_SCENARIO=panel-closed-pan CAMERA_PROFILE_OUT=trace-after-closed python scripts/android-camera-profile.py Dominion-grand-strategy-v2-release.apk
      - name: Analyze all four actual traces and preserve incomplete captures
        if: always()
        run: |
          python - <<'PYTRACE'
          import subprocess,sys
          results=[subprocess.run([sys.executable,'scripts/analyze-camera-trace.py',p]).returncode for p in ['trace-before-terrain','trace-after-terrain','trace-before-closed','trace-after-closed']]
          sys.exit(any(results))
          PYTRACE
      - name: Inspect actual scoped CPU samples; config is not evidence
        if: always()
        run: |
          python - <<'PYCPU'
          import subprocess,sys
          results=[subprocess.run([sys.executable,'scripts/analyze-camera-cpu.py',p]).returncode for p in ['trace-before-terrain','trace-after-terrain','trace-before-closed','trace-after-closed']]
          sys.exit(any(results))
          PYCPU
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-terrain-closed-cpu-traces
          path: |
            trace-before-terrain/
            trace-after-terrain/
            trace-before-closed/
            trace-after-closed/
            checkpoint-integrity.txt
            paired-run.json
            paired-jobs.json
            paired-capture-validation.json
            camera-fixture/manifest.json
          retention-days: 14

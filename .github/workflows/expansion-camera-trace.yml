name: Dominion auxiliary pinch system trace
on:
  push:
    branches: [expansion-camera-qa]
    paths: [.github/workflows/expansion-camera-trace.yml, scripts/camera_system_trace.py, scripts/camera_trace_analysis.py, scripts/analyze-camera-trace.py, scripts/camera-trace-requirements.txt, tests/camera_system_trace_test.py, tests/camera_trace_analysis_test.py, tests/camera_trace_sql_integration_test.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dominion-camera-trace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pinch-system-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAMERA_CANDIDATE_RUNTIME: 9c3da342cf9e9d83252a58278f3fe1f842ced3d9
      CAMERA_FIXTURE_PATH: camera-fixture/camera-fixture-101.1.json
      CAMERA_CANDIDATE_RUN: '38041251527'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require identical tested game runtime
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code 9c3da342cf9e9d83252a58278f3fe1f842ced3d9 HEAD -- App.tsx CampaignScreen.tsx app.json package.json package-lock.json src supabase/functions plugins assets
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/38041251527 > source-run.json
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/38041251527/jobs > source-jobs.json
          python -c "import json;r=json.load(open('source-run.json'));j=json.load(open('source-jobs.json'))['jobs'];assert r['head_sha']=='9c3da342cf9e9d83252a58278f3fe1f842ced3d9';assert all(next(x for x in j if x['name']==n)['conclusion']=='success' for n in ['build-apk','long-simulation'])"
      - name: Require already completed unchanged paired frame gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/38042596102 > paired-run.json
          gh api repos/elcin31/grand-strategy-multiplayer/actions/runs/38042596102/jobs > paired-jobs.json
          python -c "import json;r=json.load(open('paired-run.json'));j=json.load(open('paired-jobs.json'))['jobs'];assert r['head_sha']=='8e3b163ecd25271db343527dbd88258bbb57f7f9';s=next(x for x in j if x['name']=='camera-comparison')['steps'];assert next(x for x in s if x['name']=='Run reactivecircus/android-emulator-runner@v2')['conclusion']=='success'"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Generate one authoritative paused schema12 fixture for both APKs
        run: |
          git diff --exit-code 47b0db4f8b220e9ea89998afaac035239b64f5e0 9c3da342cf9e9d83252a58278f3fe1f842ced3d9 -- supabase/functions/_shared src/persistence/campaignCodec.ts
          node --import tsx scripts/make-camera-fixture.ts camera-fixture
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - run: python -m py_compile scripts/android-camera-profile.py scripts/compare-camera-native.py scripts/export-camera-evidence.py
      - run: python -m pip install -r scripts/camera-trace-requirements.txt
      - run: python -m unittest discover -s tests -p 'camera_*_test.py'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38041251527
          name: dominion-camera-illustrated-release
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37971350100
          name: dominion-camera-illustrated-release
          path: baseline-apk
      - name: Verify standalone checkpoint APK
        id: apk
        run: |
          python scripts/verify-apk.py Dominion-camera-optimized-illustrated.apk
          python scripts/verify-release.py Dominion-camera-optimized-illustrated.apk > checkpoint-integrity.txt
      - name: Compile identical real gesture driver
        id: gesture
        run: |
          mkdir -p camera-classes camera-dex
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d camera-classes scripts/CameraGesture.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output camera-dex camera-classes/CameraGesture.class
          cd camera-dex && zip ../dominion-camera.jar classes.dex
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Separate trace-only launches; no benchmark frames are retested or replaced
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb push dominion-camera.jar /data/local/tmp/dominion-camera.jar
            CAMERA_TRACE_ONLY=1 CAMERA_PROFILE_OUT=trace-before python scripts/android-camera-profile.py baseline-apk/Dominion-camera-optimized-illustrated.apk
            CAMERA_TRACE_ONLY=1 CAMERA_PROFILE_OUT=trace-after python scripts/android-camera-profile.py Dominion-camera-optimized-illustrated.apk
      - name: Analyze both actual traces and preserve incomplete captures
        if: always()
        run: |
          python - <<'PYTRACE'
          import subprocess,sys
          results=[subprocess.run([sys.executable,'scripts/analyze-camera-trace.py',p]).returncode for p in ['trace-before','trace-after']]
          sys.exit(any(results))
          PYTRACE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-pinch-system-traces
          path: |
            trace-before/
            trace-after/
            checkpoint-integrity.txt
            paired-run.json
            paired-jobs.json
            camera-fixture/manifest.json
          retention-days: 14

name: Dominion signed native multiplayer reconnect QA
on:
  push:
    branches: [expansion-qa]
    paths:
      - .github/workflows/android-online-qa.yml
      - .github/android-online-source
      - scripts/android-multiplayer-smoke.py
      - scripts/native_online_validation.py
      - tests/native_online_validation_test.py
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Compatible signed standalone build
        required: false
        type: string
  workflow_call:
    inputs:
      apk_run_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: dominion-native-online-qa
  cancel-in-progress: false
jobs:
  native-online:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact compatible signed runtime and successful standalone gates
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        run: |
          if [ -z "$APK_RUN_ID" ]; then APK_RUN_ID=$(cat .github/android-online-source); fi
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/elcin31/grand-strategy-multiplayer/actions/runs/$APK_RUN_ID" > candidate-run.json
          gh api "repos/elcin31/grand-strategy-multiplayer/actions/runs/$APK_RUN_ID/jobs" > candidate-jobs.json
          candidate_sha=$(python -c "import json;print(json.load(open('candidate-run.json'))['head_sha'])")
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$candidate_sha" HEAD -- App.tsx CampaignScreen.tsx app.json package.json package-lock.json src supabase/functions plugins assets
          python - <<'PY'
          import json,os
          jobs=json.load(open('candidate-jobs.json'))['jobs']
          candidate=next((j for j in jobs if j['name']=='build-candidate'),None)
          if candidate:
              assert candidate['conclusion']=='success'
              artifact='dominion23-performance-candidate';suffix='-v23'
          else:
              assert all(next(j for j in jobs if j['name']==n)['conclusion']=='success' for n in ['build-apk','long-simulation'])
              artifact='dominion-camera-illustrated-release';suffix=''
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('artifact='+artifact+'\nsuffix='+suffix+'\n')
          PY
          echo "run_id=$APK_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r scripts/camera-profile-requirements.txt
      - run: python -m unittest discover -s tests -p 'native_online_validation_test.py'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate-apk
      - name: Verify exact release, production endpoint and all42 packaged art assets
        id: apk
        run: |
          candidate_apk=$(find candidate-apk -maxdepth 1 -type f -name '*.apk')
          test "$(find candidate-apk -maxdepth 1 -type f -name '*.apk' | wc -l)" = 1
          python scripts/verify-apk.py "$candidate_apk"
          python scripts/verify-release.py "$candidate_apk" > candidate-integrity.txt
          python scripts/verify-packaged-art.py "$candidate_apk"
          echo "path=$candidate_apk" >> "$GITHUB_OUTPUT"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual native online create, ownership and SecureStore return
        env: {DOMINION_QA_ENDPOINT_SUFFIX: '${{ steps.source.outputs.suffix }}'}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python -u scripts/android-multiplayer-smoke.py '${{ steps.apk.outputs.path }}'
      - name: Preserve sanitized evidence and exact scoped cleanup UUID
        if: always()
        run: |
          mkdir -p android-online
          if [ -f /tmp/dominion-native-online-room-id ]; then cp /tmp/dominion-native-online-room-id android-online/room-id.txt; fi
      - name: Upload sanitized native online evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominion-native-online-evidence
          path: |
            android-online/
            candidate-run.json
            candidate-jobs.json
            candidate-integrity.txt
          if-no-files-found: warn
          retention-days: 14
